<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A five-day course on TPU hardware and software, written for GPU engineers." />
    <title>TPU Deep Dive</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 fill=%22%232c4e9e%22/%3E%3Cpath d=%22M4 4h8v8H4z%22 fill=%22none%22 stroke=%22white%22/%3E%3C/svg%3E" />
    <script>
      // Apply the saved or requested theme before first paint.
      (function () {
        try {
          var q = new URLSearchParams(location.search).get('theme');
          var t = q || (JSON.parse(localStorage.getItem('tpudd:v1') || '{}').prefs || {}).theme;
          if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
