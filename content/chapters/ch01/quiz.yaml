# Chapter 1 quiz (draft: 5 of the planned 8-12 questions).
- id: ch01-ridge-def
  type: mcq
  prompt: "A chip's ridge point against HBM is defined as:"
  options:
    - text: Peak FLOP/s divided by HBM bandwidth in bytes/s.
      correct: true
      why: "It is the arithmetic intensity at which $T_\\text{math} = T_\\text{comms}$. Above it a kernel is compute-bound."
    - text: HBM capacity divided by peak FLOP/s.
      why: Capacity limits what fits, not how fast it runs. It has units of seconds per byte-of-capacity and appears in no roofline.
    - text: The batch size at which HBM fills up.
      why: That is a memory-capacity limit. The ridge point is independent of capacity.
    - text: Peak FLOP/s divided by ICI bandwidth.
      why: That ratio exists, but it is the ICI roofline, used for sharded matmuls in Chapter 5. The HBM ridge uses HBM bandwidth.
  explanation: "Ironwood: $2.307\\times10^{15} / 7.38\\times10^{12} = 313$ FLOP/B."
  source: "SB1 #where-does-the-time-go"

- id: ch01-ironwood-ridge
  type: numeric
  prompt: "Ironwood (TPU7x) has 2,307 TFLOP/s of dense BF16 and 7,380 GB/s of HBM bandwidth per chip. What is its BF16 ridge point, in FLOPs per byte?"
  answer: 312.6
  tolerance: 0.03
  unit: FLOP/B
  explanation: "$2.307 \\times 10^{15} / 7.38 \\times 10^{12} = 312.6$. A bf16 matmul on Ironwood needs a per-chip token batch above about 313 to be compute-bound."
  source: "D-7x"

- id: ch01-int8-weights-v5e
  type: numeric
  prompt: "On TPU v5e (197 TFLOP/s bf16, 820 GB/s HBM), you store a matmul's weights in int8 and keep activations and arithmetic in bf16. Ignoring activation bytes, above what token batch B does the matmul become compute-bound?"
  answer: 120
  tolerance: 0.05
  unit: tokens
  explanation: "FLOPs are $2BDF$; weight bytes are now $DF$. Compute-bound when $2BDF / DF = 2B > 1.97\\times10^{14}/8.2\\times10^{11} = 240$, so $B > 120$."
  adapted_from: SB1 Q2
  source: "SB1 #a-few-problems-to-work"

- id: ch01-decode-bottleneck
  type: scenario
  prompt: "A decode step runs the LLaMA-3-70B MLP up-projection ($D = 8192$, $F = 28672$, bf16) at a token batch of 64 on one Ironwood chip. The profile shows 64 µs for the op. What bounds it?"
  options:
    - text: "HBM bandwidth: 470 MB of weights at 7,380 GB/s is 64 µs; the 30 GFLOP of math would take 13 µs."
      correct: true
      why: "Intensity is 63 FLOP/B against a ridge of 313, so the op is HBM-bound by 4.9×."
    - text: "MXU throughput: 30 GFLOP at 2,307 TFLOP/s."
      why: "That is 13 µs, a fifth of the measured time. The MXUs are idle about 80% of the op."
    - text: "ICI bandwidth, because the weights are sharded."
      why: "The scenario is one chip with no sharding, so no ICI traffic is involved."
    - text: "Kernel launch overhead."
      why: "XLA compiles the step into one program; there is no per-op host launch on the critical path. 64 µs matches the HBM estimate exactly."
  explanation: "To make the MXUs the bottleneck you would need about 329 tokens in the batch, or a smaller weight footprint per token."
  source: "SB1 #matrix-multiplication"

- id: ch01-explain-int8
  type: free
  prompt: "Explain to a GPU engineer why int8 weights with bf16 math halve the batch needed for a compute-bound matmul, while int8 weights with int8 math do not."
  model_answer: "The compute-bound batch is where FLOPs per byte equals peak FLOP/s per byte of bandwidth. Int8 weights halve the bytes read per weight but leave the FLOPs unchanged, so each weight byte now carries twice the arithmetic and the batch needed halves: 240 to 120 on v5e. Switching the math to int8 as well doubles the peak rate (197 to 394 TOP/s on v5e), which doubles the chip's ridge point. The two effects cancel and the compute-bound batch returns to about 240. The step still runs faster, because the bytes halved; only the batch at which the MXUs saturate is unchanged."
  adapted_from: SB1 Q1-Q2
  source: "SB1 #a-few-problems-to-work"
