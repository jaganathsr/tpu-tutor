# Chapter 1 flashcards.
- id: ch01-c-ridge
  front: What is a chip's ridge point, and what is it for Ironwood in BF16?
  back: "Peak FLOP/s over HBM bytes/s. Ironwood: $2.307\\times10^{15} / 7.38\\times10^{12} \\approx 313$ FLOP/B."
  source: D-7x
- id: ch01-c-matmul-ai
  front: "Arithmetic intensity of a bf16 matmul $X[B,D] \\cdot W[D,F]$ when $B \\ll D, F$?"
  back: "About $B$, the token batch. Weight bytes dominate, and each weight byte is used once per token."
  source: SB1 #matrix-multiplication
- id: ch01-c-v5e
  front: Compute-bound token batch for a bf16 matmul on TPU v5e?
  back: About 240 (197 TFLOP/s over 820 GB/s).
  source: SB1
- id: ch01-c-h100
  front: Compute-bound token batch for a bf16 matmul on an H100 SXM?
  back: About 295 (989 dense TFLOP/s over 3.35 TB/s).
  source: SB1 Q5
- id: ch01-c-int8w
  front: Effect of int8 weights with bf16 math on the compute-bound batch?
  back: "Halves it. 240 becomes 120 on v5e; 313 becomes about 156 on Ironwood."
  source: SB7
- id: ch01-c-fp8math
  front: Effect of moving the math to fp8 as well as the weights, on Ironwood?
  back: "Peak doubles to 4,614 TFLOP/s, the ridge doubles to 625, and the compute-bound batch returns to the bf16 value. The step still speeds up, because bytes halved."
  source: D-7x
- id: ch01-c-tokens
  front: Does the 240-token rule count sequences or tokens, and does model sharding change it?
  back: Tokens, per replica. Model sharding divides FLOPs and bandwidth by the same factor, so it does not change it.
  source: SB1
- id: ch01-c-bounds
  front: "Lower and upper bounds on kernel time from $T_\\text{math}$ and $T_\\text{comms}$?"
  back: "Lower: $\\max(T_\\text{math}, T_\\text{comms})$, with perfect overlap. Upper: their sum, with none. At most 2× apart."
  source: SB1 #where-does-the-time-go
- id: ch01-c-growth
  front: From TPUv2 to Ironwood, how much did per-chip BF16 FLOP/s and HBM bandwidth grow?
  back: "FLOP/s 50× (46 to 2,307 TFLOP/s); HBM bandwidth 10.5× (700 to 7,380 GB/s). The ridge rose from 66 to 313 FLOP/B."
  source: P-v23, D-7x
- id: ch01-c-v1
  front: TPUv1 in one line, and its bottleneck?
  back: "2015 inference card: one 256×256 int8 array, 92 TOPS, 8 GiB DDR3 at 34 GB/s. Memory-bound on most workloads (ridge 1,350 ops per weight byte)."
  source: P-v1
- id: ch01-c-v2
  front: What did TPUv2 add to make training possible?
  back: "HBM (700 GB/s, about 20× v1), a vector unit with bf16 multiply and fp32 accumulate, and ICI links forming a 2D torus with no external switch."
  source: P-Norrie
- id: ch01-c-v4
  front: Three things TPU v4 introduced?
  back: "4×4×4 cubes joined by optical circuit switches into a 3D torus of 4,096 chips; SparseCores for embeddings; 128 MiB of on-chip CMEM."
  source: P-v4
- id: ch01-c-v6e
  front: What changed in the matrix unit with v6e Trillium?
  back: "128×128 became 256×256, giving 4.7× v5e's peak per chip. Ironwood keeps 256×256."
  source: G-v6e, D-arch
- id: ch01-c-ironwood
  front: Ironwood headline specs?
  back: "Two chiplets (2 JAX devices per chip), 2,307 TFLOP/s BF16, 4,614 fp8, 192 GiB HBM at 7,380 GB/s, 9,216-chip pods at about 10 MW."
  source: D-7x, G-7x
- id: ch01-c-tpu8
  front: TPU 8t versus TPU 8i?
  back: "8t: training, 3D torus, 9,600-chip superpod, 216 GB HBM at 6,528 GB/s, 2× Ironwood ICI. 8i: inference, 288 GB at 8,601 GB/s, 384 MB SRAM, Boardfly network (at most 7 hops), collectives engine instead of SparseCores."
  source: G-8dd
- id: ch01-c-netroof
  front: "When is splitting a matmul's contracting dimension over 2 chips compute-bound?"
  back: "When $D > 2C / W_\\text{link}$ (one-way link bandwidth). v5e: $D > 8{,}755$. Ironwood: $D > 46{,}140$, derived."
  source: SB1 #network-communication-rooflines
- id: ch01-c-vpu
  front: What is the VPU's critical intensity on v5p, and what follows?
  back: "About 3 FLOP/B (about 7 TFLOP/s per core). Elementwise ops are memory-bound unless fused into a neighbouring matmul."
  source: SB1
- id: ch01-c-latency
  front: Below what chunk size is an ICI transfer latency-bound on v5e?
  back: "About 45 kB per hop: 1 µs per hop times 45 GB/s."
  source: SB3
